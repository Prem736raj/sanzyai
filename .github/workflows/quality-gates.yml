name: quality-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CSP inline-handler guard
        run: npm run check:inline-handlers

      - name: Validate structured data
        run: npm run validate:structured-data

      - name: Validate internal routes and redirects
        run: npm run check:routes

      - name: API security regression tests
        run: npm run test:api

      - name: Build
        run: npm run build

      - name: Bundle and image budgets
        run: npm run test:performance

      - name: Validate HTML
        run: npm run validate:html

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression and journey tests
        run: npm run test:smoke

      - name: Run accessibility and contrast audit
        run: npm run test:a11y:ci

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json

      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,301,302,429 --exclude-mail **/*.html README.md
