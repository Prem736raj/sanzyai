name: Update AI News Fallback Cache
on:
  # Cron disabled to prevent automated unverified code mutations.
  # Run manually via workflow_dispatch to refresh the static fallback cache.
  workflow_dispatch: {}

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch and generate deterministic news fallback cache
        run: |
          mkdir -p public/data
          curl -s "https://hn.algolia.com/api/v1/search?query=AI+artificial+intelligence&tags=story&hitsPerPage=8" \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const items = data.hits.map((h, i) => ({
                id: i + 1,
                type: ['Model Release','Product Launch','Research','Policy','AI Update','Creator Economy','Funding'][i % 7],
                urgency: h.points > 200 ? 'high' : h.points > 100 ? 'medium' : 'low',
                title: h.title,
                source: 'Hacker News',
                sourceType: 'news',
                sourceUrl: h.url || 'https://news.ycombinator.com/item?id=' + h.objectID,
                timeAgo: new Date(h.created_at).toLocaleDateString(),
                impact: Math.min(99, Math.floor(h.points / 3)),
                opportunity: Math.min(95, Math.max(50, Math.floor(h.points / 2))),
                company: 'AI Industry',
                summary: h.title + '. Reported on Hacker News with ' + h.points + ' points.',
                whyItMatters: 'Stay informed about the latest developments in AI technology and policy.',
                actions: ['Read the full article for details.', 'Consider how this affects your AI workflow.', 'Share with your team if relevant.']
              }));
              require('fs').writeFileSync('public/data/news-fallback.json', JSON.stringify(items, null, 2) + '\n');
            "
      
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news-fallback.json
          git diff --cached --quiet || git commit -m "chore: refresh static AI news fallback cache [skip ci]"
          git push

